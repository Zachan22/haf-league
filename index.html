<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAF Pro Clubs League</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: var(--text-muted);
            margin-top: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .card h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            font-size: 1.4rem;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        /* Forms */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            border: none;
            border-radius: 6px;
            color: var(--bg-color);
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Fixtures */
        .fixture-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .fixture-item:last-child {
            border-bottom: none;
        }

        .vs {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🏆 HAF Pro Clubs League</h1>
        <p>Official Standings, Fixtures, and Live Match Submission</p>
    </header>

    <div class="grid">
        <!-- Left Column: Standings & Schedule -->
        <div>
            <!-- Standings Card -->
            <div class="card">
                <h2>League Table</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Team</th>
                            <th>P</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GD</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="league-table-body">
                        <!-- Dynamic content injected by JavaScript -->
                    </tbody>
                </table>
            </div>

            <!-- Fixtures Card -->
            <div class="card">
                <h2>Upcoming Fixtures & Schedule</h2>
                <div id="fixtures-list">
                    <!-- Dynamic content injected by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Right Column: Controls -->
        <div>
            <!-- Add Team Card -->
            <div class="card">
                <h2>➕ Add New Team</h2>
                <form id="add-team-form">
                    <div class="form-group">
                        <label for="new-team-name">Team Name</label>
                        <input type="text" id="new-team-name" placeholder="e.g., Tekkz United" required>
                    </div>
                    <button type="submit">Register Team</button>
                </form>
            </div>

            <!-- Log Match Card -->
            <div class="card">
                <h2>⚽ Log Match Result</h2>
                <form id="log-match-form">
                    <div class="form-group">
                        <label for="home-team-select">Home Team</label>
                        <select id="home-team-select" required></select>
                    </div>
                    <div class="form-group">
                        <label for="home-score">Home Score</label>
                        <input type="number" id="home-score" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="away-team-select">Away Team</label>
                        <select id="away-team-select" required></select>
                    </div>
                    <div class="form-group">
                        <label for="away-score">Away Score</label>
                        <input type="number" id="away-score" min="0" required>
                    </div>
                    <button type="submit">Submit Result</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Initial League State
    let teams = {
        "HAF Hackers": { played: 0, wins: 0, draws: 0, losses: 0, gd: 0, pts: 0 },
        "LeBoshLads": { played: 0, wins: 0, draws: 0, losses: 0, gd: 0, pts: 0 }
    };

    // Render Table, Dropdowns, and Schedule on startup
    function updateDashboard() {
        renderTable();
        renderDropdowns();
        renderSchedule();
    }

    // Sort and Render Table
    function renderTable() {
        const tbody = document.getElementById('league-table-body');
        tbody.innerHTML = '';

        // Sort by Points, then Goal Difference
        const sortedTeams = Object.keys(teams).sort((a, b) => {
            if (teams[b].pts !== teams[a].pts) return teams[b].pts - teams[a].pts;
            return teams[b].gd - teams[a].gd;
        });

        sortedTeams.forEach((teamName, index) => {
            const data = teams[teamName];
            const row = `
                <tr>
                    <td><strong>${index + 1}</strong></td>
                    <td><strong>${teamName}</strong></td>
                    <td>${data.played}</td>
                    <td>${data.wins}</td>
                    <td>${data.draws}</td>
                    <td>${data.losses}</td>
                    <td>${data.gd > 0 ? '+' + data.gd : data.gd}</td>
                    <td style="color: var(--accent-color); font-weight: bold;">${data.pts}</td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    // Dynamically Populate Form Dropdowns
    function renderDropdowns() {
        const homeSelect = document.getElementById('home-team-select');
        const awaySelect = document.getElementById('away-team-select');
        
        homeSelect.innerHTML = '<option value="" disabled selected>Select home team</option>';
        awaySelect.innerHTML = '<option value="" disabled selected>Select away team</option>';

        Object.keys(teams).forEach(team => {
            homeSelect.innerHTML += `<option value="${team}">${team}</option>`;
            awaySelect.innerHTML += `<option value="${team}">${team}</option>`;
        });
    }

    // Basic dynamic schedule generation (Round Robin logic if 3+, Derby logic if 2)
    function renderSchedule() {
        const list = document.getElementById('fixtures-list');
        list.innerHTML = '';
        const teamNames = Object.keys(teams);

        if (teamNames.length === 2) {
            list.innerHTML += `<div class="fixture-item"><span>${teamNames[0]}</span> <span class="vs">VS</span> <span>${teamNames[1]}</span></div>`;
            list.innerHTML += `<div class="fixture-item"><span>${teamNames[1]}</span> <span class="vs">VS</span> <span>${teamNames[0]}</span></div>`;
        } else {
            // Generate basic matchday loops for display
            for (let i = 0; i < teamNames.length; i++) {
                for (let j = i + 1; j < teamNames.length; j++) {
                    list.innerHTML += `<div class="fixture-item"><span>${teamNames[i]}</span> <span class="vs">VS</span> <span>${teamNames[j]}</span></div>`;
                }
            }
        }
    }

    // Add New Team Handler
    document.getElementById('add-team-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const teamNameInput = document.getElementById('new-team-name');
        const name = teamNameInput.value.trim();

        if (name && !teams[name]) {
            teams[name] = { played: 0, wins: 0, draws: 0, losses: 0, gd: 0, pts: 0 };
            teamNameInput.value = '';
            updateDashboard();
        } else if (teams[name]) {
            alert("This team is already registered in the league!");
        }
    });

    // Match Result Submission Handler
    document.getElementById('log-match-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const homeTeam = document.getElementById('home-team-select').value;
        const awayTeam = document.getElementById('away-team-select').value;
        const homeScore = parseInt(document.getElementById('home-score').value);
        const awayScore = parseInt(document.getElementById('away-score').value);

        if (homeTeam === awayTeam) {
            alert("A team cannot play against itself!");
            return;
        }

        // Update stats
        teams[homeTeam].played += 1;
        teams[awayTeam].played += 1;
        teams[homeTeam].gd += (homeScore - awayScore);
        teams[awayTeam].gd += (awayScore - homeScore);

        if (homeScore > awayScore) {
            teams[homeTeam].wins += 1;
            teams[homeTeam].pts += 3;
            teams[awayTeam].losses += 1;
        } else if (awayScore > homeScore) {
            teams[awayTeam].wins += 1;
            teams[awayTeam].pts += 3;
            teams[homeTeam].losses += 1;
        } else {
            teams[homeTeam].draws += 1;
            teams[homeTeam].pts += 1;
            teams[awayTeam].draws += 1;
            teams[awayTeam].pts += 1;
        }

        // Reset inputs & refresh UI
        document.getElementById('log-match-form').reset();
        updateDashboard();
    });

    // Initialize on page load
    updateDashboard();
</script>
</body>
</html>
